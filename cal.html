<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <script>
        var nu1 = parseInt(prompt("digite su primer numero"));
        var nu2 = parseInt(prompt("digite su segundo numero"));
        var operacion = prompt("digite su operacion: + , - , * , /");
        var resultado;

        if (operacion == "+") {
            resultado = nu1 + nu2;
        } else if (operacion == "-") {
            resultado = nu1 - nu2;
        } else if (operacion == "*") {
            resultado = nu1 * nu2;
        } else if (operacion == "/") {
            if (nu2 == 0) {
                resultado = "No se puede dividir entre 0";
            } else {
                resultado = nu1 / nu2;
            }
        } else {
            resultado = "Operacion no valida";
        }

        document.write("<h1>Calculadora</h1>");
        document.write("<p>primer numero: " + nu1 + "</p>");
        document.write("<p>segundo numero: " + nu2 + "</p>");
        document.write("<p>Operacion: " + operacion + "</p>");
        document.write("<h2>Resultado: " + resultado + "</h2>");
    </script>
</body>
</html>
